  <head>
    <meta charset="utf-8" />
    <!-- TEMA ÖNYÜKLEME: ÜRETİLMİŞ — elle düzenlemeyin -->
    <script>(function(){try{var t=localStorage.getItem("idmon.tema");if(t!=="dark"&&t!=="light")return;document.documentElement.setAttribute("data-theme",t);var s=document.querySelector('meta[name="theme-color"][media*="'+t+'"]');if(!s)return;var m=document.createElement("meta");m.setAttribute("name","theme-color");m.setAttribute("content",s.getAttribute("content"));document.head.insertBefore(m,document.head.firstChild);}catch(e){}})();</script>
    <!-- TEMA ÖNYÜKLEME: SON -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />

    <script type="module" crossorigin src="./assets/showcase-y395Y6Jv.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="stylesheet" crossorigin href="./assets/showcase-Dc9uRh5c.css">
  </head>
  <body>
    <a class="atla" href="#icerik">İçeriğe atla</a>

      </p>
    </footer>
  </body>
</html>
